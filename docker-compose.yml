version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    command: -p ${POSTGRES_PORT:-5432}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payment}
      POSTGRES_DB: ${POSTGRES_DB:-payment}
    ports:
      - "${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DB:-payment} -p ${POSTGRES_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - payment

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${BROKER_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${BROKER_PASSWORD:-guest}
      RABBITMQ_NODE_PORT: ${BROKER_PORT:-5672}
    ports:
      - "${BROKER_PORT:-5672}:${BROKER_PORT:-5672}"
      - "15672:15672"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - payment

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: payments:latest
    command: >
      sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port ${APPLICATION_PORT:-8000} --reload"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    ports:
      - "${APPLICATION_PORT:-8000}:${APPLICATION_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - payment

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    image: payments:latest
    command: faststream run src.consumer:app
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - payment

volumes:
  postgres_data:

networks:
  payment:
    driver: bridge
